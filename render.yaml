# Render Blueprint (server Node.js persisten: Express menyajikan dist/ + endpoint /api/contact).
# Render > New > Blueprint > pilih repositori ini. Isi nilai env yang bertanda sync: false di dashboard.
services:
  - type: web
    name: immersive-portfolio
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
